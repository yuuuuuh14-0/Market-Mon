<div class="site-shell">
  <header class="site-header">
    <a class="brand" routerLink="/" aria-label="Market Mon 홈">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-name">Market <span>Mon</span></span>
    </a>

    <nav class="header-nav" aria-label="주요 메뉴">
      <a class="nav-link" routerLink="/" fragment="features">서비스 소개</a>
      @if (auth.status() === 'loading') {
        <span class="nav-status" aria-live="polite">계정 확인 중…</span>
      } @else if (auth.user(); as user) {
        <a class="nav-link" routerLink="/profile">{{ profiles.profile()?.displayName || user.displayName || '내 계정' }}</a>
        <button class="nav-cta" type="button" [disabled]="auth.isBusy()" (click)="auth.logOut()">로그아웃</button>
      } @else {
        <a class="nav-cta" routerLink="/login">로그인 <span aria-hidden="true">↗</span></a>
      }
    </nav>
  </header>

  @if (auth.error()) {
    <div class="global-message" role="alert">
      <span>{{ auth.error() }}</span>
      <button type="button" (click)="auth.clearError()" aria-label="알림 닫기">닫기</button>
    </div>
  }

  <main id="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <a class="footer-brand" routerLink="/">Market Mon</a>
    <span>함께 모으고, 함께 결정하는 우리 반 경제</span>
    <span>© {{ currentYear }} Market Mon</span>
  </footer>
</div>
