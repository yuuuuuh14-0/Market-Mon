<section class="message-page" aria-labelledby="login-title">
  <div class="message-card">
    <span class="message-symbol" aria-hidden="true">M</span>
    <p class="message-eyebrow">MARKET MON 계정</p>
    <h1 id="login-title">Google 계정으로<br>시작해요.</h1>
    <p class="message-copy">로그인하면 우리 반 활동에 참여하고 계정 모드를 설정할 수 있어요. 계정 이메일은 앱 프로필에 저장하지 않습니다.</p>
    <button class="google-button" type="button" [disabled]="auth.isBusy() || auth.status() === 'loading'" (click)="auth.signInWithGoogle()">
      @if (auth.isBusy()) { Google 로그인으로 이동 중… } @else { <span class="google-mark" aria-hidden="true">G</span> Google로 로그인 }
    </button>
    @if (auth.error()) { <p class="login-error" role="alert">{{ auth.error() }}</p> }
    <a class="back-link" routerLink="/">홈으로 돌아가기 <span aria-hidden="true">→</span></a>
  </div>
</section>
